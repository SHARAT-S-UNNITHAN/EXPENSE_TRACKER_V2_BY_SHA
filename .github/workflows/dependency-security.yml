name: Dependency security and Django checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/dependency-updates]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pillow 13 requires Python 3.11+, so validate supported current runtimes.
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Install required NLTK data
        run: |
          python -m nltk.downloader punkt punkt_tab stopwords

      - name: Run Django system checks
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
        run: python manage.py check

      - name: Run automated tests
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
        run: python manage.py test
